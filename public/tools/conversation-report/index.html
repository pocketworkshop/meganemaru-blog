<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6f91"><title>会話レポメーカー｜めがねまるのブログ</title><link rel="icon" href="/assets/bear-logo.png"><link rel="stylesheet" href="./report.css"></head><body>
<header><a href="/"><img src="/assets/bear-logo.png" alt=""><b>めがねまるのブログ</b></a><a href="/">ホームへ</a></header>
<main><section class="intro">
<div class="intro-deco" aria-hidden="true"><span>♡</span><span>✦</span><span>💬</span><span>✦</span><span>♡</span></div>
<small>CONVERSATION REPORT MAKER</small><h1>会話レポメーカー</h1>
<p>思い出の会話を、かわいい吹き出しレポに ♡</p>
<div class="mini-tags"><span>自分は右 →</span><span>← 相手は左</span><span>複数人OK</span></div>
</section>
<section class="panel panel-pink"><h2><span class="step-icon">👥</span>① 参加者を設定</h2><label>自分の名前</label><div class="row"><input id="me" placeholder="例：めがねまる"><button id="rememberMe">記憶</button></div><div class="between"><b>相手</b><button id="addPerson">＋ 相手を追加</button></div><div id="people"><div class="person"><input data-person="0" list="history" placeholder="相手1の名前"></div></div><datalist id="history"></datalist><details><summary>記憶した名前を整理</summary><div id="historyChips"></div></details></section>
<section class="panel panel-yellow"><h2><span class="step-icon">📝</span>② レポ情報</h2><div class="meta"><label>タイトル<input id="title" placeholder="例：お話し会レポ"></label><label>日付<input id="date" type="date"></label><label>部・枠<input id="slot" placeholder="例：第2部"></label></div></section>
<section class="panel panel-blue"><h2><span class="step-icon">💬</span>③ 会話を追加</h2><div id="speakers" class="speakers"><button class="speaker me active" data-side="me">自分</button><button class="speaker" data-side="other" data-i="0">相手1</button></div><textarea id="message" rows="3" placeholder="発言を入力"></textarea><button class="primary" id="addMessage">💬 発言を追加</button></section>
<section class="panel panel-green"><h2><span class="step-icon">✨</span>④ 完成イメージ</h2><div class="card"><div class="cardhead"><b id="ptitle">会話レポ</b><small id="pmeta"></small></div><div id="conversation" class="conversation"><div class="empty">会話を追加すると、ここに吹き出しが表示されます。</div></div><footer>会話レポメーカー</footer></div><div class="actions"><button id="copy">📋 テキストをコピー</button><button class="primary" id="image">🖼️ 画像として保存</button><button class="x-share" id="shareX">𝕏 画像＋URLを共有</button></div><p class="note">画像は端末内で生成します。X共有はスマホの共有機能を使います。</p></section></main>
