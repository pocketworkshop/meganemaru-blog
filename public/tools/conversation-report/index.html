<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6f91"><title>会話レポメーカー｜めがねまるのブログ</title><link rel="icon" href="/assets/bear-logo.png"><link rel="stylesheet" href="./report.css"></head><body>
<header><a href="/"><img src="/assets/bear-logo.png" alt=""><b>めがねまるのブログ</b></a><a href="/">ホームへ</a></header>
<main><section class="intro"><small>CONVERSATION REPORT MAKER</small><h1>会話レポメーカー</h1><p>自分は右、相手は左。会話を吹き出しにしてレポを作れます。</p></section>
<section class="panel"><h2>① 参加者を設定</h2><label>自分の名前</label><div class="row"><input id="me" placeholder="例：めがねまる"><button id="rememberMe">記憶</button></div><div class="between"><b>相手</b><button id="addPerson">＋ 相手を追加</button></div><div id="people"></div><datalist id="history"></datalist><details><summary>記憶した名前を整理</summary><div id="historyChips"></div></details></section>
<section class="panel"><h2>② レポ情報</h2><div class="meta"><label>タイトル<input id="title" placeholder="例：お話し会レポ"></label><label>日付<input id="date" type="date"></label><label>部・枠<input id="slot" placeholder="例：第2部"></label></div></section>
<section class="panel"><h2>③ 会話を追加</h2><div id="speakers" class="speakers"></div><textarea id="message" rows="3" placeholder="発言を入力"></textarea><button class="primary" id="addMessage">＋ 発言を追加</button></section>
<section class="panel"><h2>④ 完成イメージ</h2><div id="card" class="card"><div class="cardhead"><b id="ptitle">会話レポ</b><small id="pmeta"></small></div><div id="conversation" class="conversation"></div><footer>めがねまるのブログ｜会話レポメーカー</footer></div><div class="actions"><button id="copy">テキストをコピー</button><button class="primary" id="image">画像として保存</button><button class="x-share" id="shareX">𝕏 に画像を共有</button></div><p class="note">X共有はスマホの共有機能を使います。共有先でXを選ぶと、生成した画像を投稿画面へ渡せます。</p></section></main>
