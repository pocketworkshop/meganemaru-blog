<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#ff6f91" />
  <title>お問い合わせ管理 | めがねまるのブログ</title>
  <link rel="icon" href="/assets/bear-logo.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
  <link rel="stylesheet" href="/admin/contacts.css" />
</head>
<body>
  <header class="cms-header">
    <a href="/admin/" class="cms-brand"><img src="/assets/bear-logo.png" alt=""><span>めがねまるのブログ<small>お問い合わせ管理</small></span></a>
    <div class="contact-admin-actions"><a href="/admin/">記事管理へ</a><a href="/contact/" target="_blank" rel="noopener">フォームを見る ↗</a></div>
  </header>
  <main class="cms-shell contact-admin-shell">
    <div class="section-title"><div><span class="section-kicker">CONTACTS</span><h1>お問い合わせ</h1><p>フォームから届いたメッセージを確認できます。</p></div><strong id="unreadBadge" class="unread-badge">0件未読</strong></div>
    <nav class="status-tabs" aria-label="お問い合わせの状態"><button id="showAll" class="active">すべて</button><button id="showUnread">未読のみ</button></nav>
    <p id="contactAdminStatus" class="notice" role="status" aria-live="polite">読み込み中…</p>
    <div id="contactList" class="contact-admin-list"></div>
  </main>
  <script type="module" src="/admin/contacts.js"></script>
</body>
</html>
